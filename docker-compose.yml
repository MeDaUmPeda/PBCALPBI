services:
  postgres:
    image: postgres:16-alpine
    container_name: casademassas-db
    environment:
      POSTGRES_DB: casademassas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
