# Conexao PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/casademassas_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true 

# Analise trimestral: variacao percentual (preco medio 12 semanas vs preco inicial) que dispara alerta de reajuste
analise.limite-variacao=10

# LLM que explica a previsao (qualquer API compativel com a da OpenAI). Sem chave, o sistema usa o texto padrao.
llm.base-url=https://api.groq.com/openai/v1
llm.modelo=openai/gpt-oss-120b
llm.api-key=${LLM_API_KEY:}

# Inclui a mensagem das exceções (ex.: ResponseStatusException) no corpo da resposta de erro
server.error.include-message=always
