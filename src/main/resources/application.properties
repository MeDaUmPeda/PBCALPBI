# Conexao PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/casademassas_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true 

# Analise trimestral: variacao percentual (preco medio 12 semanas vs preco inicial) que dispara alerta de reajuste
analise.limite-variacao=10
